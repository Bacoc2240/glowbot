{% extends "web/base.html" %}
{% block titulo %}Ingresar — GlowBot{% endblock %}
{% block contenido %}
<div class="card" x-data="login()">
  <h2>Ingresa a tu panel</h2>
  <label>Correo electrónico</label>
  <input type="email" x-model="email" placeholder="tu@correo.com">
  <label>Contraseña</label>
  <input type="password" x-model="password" @keyup.enter="entrar">
  <p class="error" x-text="error" x-show="error"></p>
  <br>
  <button @click="entrar" x-text="cargando ? 'Ingresando…' : 'Ingresar'"></button>
  <p class="muted" style="margin-top:10px; text-align:center">
    <a href="/panel/recuperar">¿Olvidaste tu contraseña?</a>
  </p>
  <p class="muted" style="margin-top:12px; text-align:center">
    ¿No tienes cuenta? <a href="/registro">Crea tu prueba gratis</a>
  </p>
</div>
<script>
function login() {
  return {
    email: "", password: "", error: "", cargando: false,
    async entrar() {
      this.cargando = true; this.error = "";
      const r = await fetch("/api/v1/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: this.email, password: this.password }),
      });
      this.cargando = false;
      if (!r.ok) { this.error = "Correo o contraseña incorrectos."; return; }
      const d = await r.json();
      localStorage.setItem("glowbot_access", d.access);
      localStorage.setItem("glowbot_refresh", d.refresh);
      // A cada rol su pantalla: el superadmin no tiene establecimiento y
      // /panel le pinta una agenda vacia de un negocio que no existe.
      window.location = inicioSegunRol();
    },
  };
}
</script>
{% endblock %}
