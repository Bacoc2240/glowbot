{% extends "web/base.html" %}
{% block titulo %}Servicios — GlowBot{% endblock %}
{% block top_derecha %}<a href="#" onclick="salir()" style="color:#fff;font-size:13px">Salir</a>{% endblock %}
{% block contenido %}
<div x-data="config()" x-init="cargar()">

  <div class="card">
    <h2>Mis servicios</h2>
    <p class="ok" x-show="avisoS" x-text="avisoS" style="margin-bottom:8px"></p>
    <template x-for="s in servicios" :key="s.id">
      <div class="fila" style="border-bottom:1px solid var(--borde);padding:8px 0">
        <div>
          <b x-text="s.nombre" :style="!s.activo ? 'opacity:.55' : ''"></b>
          <!-- Un servicio desactivado se veia EXACTAMENTE igual que uno
               activo. El dueno pulsaba Eliminar, lo seguia viendo en su
               sitio y concluia que no funcionaba. -->
          <span class="chip chip-inactivo" x-show="!s.activo">Desactivado</span>
          <div class="muted" x-text="s.duracion_min + ' min'"></div>
          <div class="muted" x-show="!s.activo">
            No se ofrece a clientes nuevos. Sus citas ya agendadas siguen en pie.
          </div>
        </div>
        <div style="max-width:110px">
          <button class="btn-peligro" style="padding:7px;font-size:12px"
                  x-show="s.activo" @click="borrarServicio(s)">Eliminar</button>
          <button class="btn btn-borde" style="padding:7px;font-size:12px"
                  x-show="!s.activo" @click="reactivarServicio(s)">Reactivar</button>
        </div>
      </div>
    </template>
    <label>Nombre del servicio</label>
    <input x-model="nuevo.nombre" placeholder="Ej: Corte clásico">
    <div class="fila">
      <div><label>Duración (min)</label><input type="number" x-model.number="nuevo.duracion_min"></div>
    </div>
    <p class="error" x-text="errorS" x-show="errorS"></p><br>
    <button @click="crearServicio">Agregar servicio</button>
  </div>

  <div class="card">
    <h2>Mi equipo</h2>
    <template x-for="p in profesionales" :key="p.id">
      <div style="border-bottom:1px solid var(--borde);padding:10px 0">
        <div class="fila">
          <div><b x-text="p.nombre"></b>
            <div class="muted" x-text="p.telefono_whatsapp || 'Sin WhatsApp registrado'"></div></div>
          <a href="#" style="flex:0 0 auto;font-size:13px"
             @click.prevent="editando = (editando === p.id ? null : p.id)"
             x-text="editando === p.id ? 'Cerrar' : 'Servicios'"></a>
        </div>

        <!-- Un profesional sin servicios no aparece en la agenda: el
             asistente solo ofrece combinaciones que existan en la tabla
             puente. Es un estado valido, pero el dueno tiene que VERLO. -->
        <p class="error" x-show="!p.servicios || p.servicios.length === 0">
          Sin servicios asignados: no aparecerá en la agenda ni el asistente
          podrá reservarle citas.
        </p>
        <p class="muted" x-show="p.servicios && p.servicios.length > 0"
           x-text="nombresDe(p.servicios)"></p>

        <div x-show="editando === p.id" style="margin-top:8px">
          <p class="muted" x-show="servicios.length === 0">
            Primero crea al menos un servicio arriba.
          </p>
          <template x-for="s in servicios" :key="s.id">
            <label style="display:flex;gap:8px;align-items:center;color:var(--texto);
                          margin:0;padding:6px 0;cursor:pointer">
              <input type="checkbox" style="width:auto;flex:0 0 auto"
                     :checked="p.servicios.includes(s.id)"
                     @change="alternar(p, s.id)">
              <span x-text="s.nombre"></span>
            </label>
          </template>
          <p class="error" x-show="errorAsig[p.id]" x-text="errorAsig[p.id]"></p>
          <button style="margin-top:8px" @click="guardarServicios(p)"
                  :disabled="guardando">Guardar servicios</button>
          <p class="ok" x-show="guardado === p.id">Guardado.</p>
        </div>
      </div>
    </template>
    <label>Nombre del profesional</label>
    <input x-model="nuevoProf.nombre" placeholder="Ej: Carlos">
    <label>WhatsApp (para alertas de cancelación)</label>
    <input x-model="nuevoProf.telefono_whatsapp" placeholder="3001234567">
    <p class="error" x-text="errorP" x-show="errorP"></p><br>
    <button @click="crearProfesional">Agregar profesional</button>
  </div>
  <div class="espacio-nav"></div>
</div>

<script>
function config() {
  return {
    servicios: [], profesionales: [],
    nuevo: { nombre: "", duracion_min: 30 },
    nuevoProf: { nombre: "", telefono_whatsapp: "" },
    errorS: "", errorP: "", avisoS: "",
    editando: null, guardando: false, guardado: null, errorAsig: {},

    nombresDe(ids) {
      return this.servicios
        .filter(s => ids.includes(s.id))
        .map(s => s.nombre)
        .join(" · ");
    },
    // Se marca en memoria y se guarda al pulsar el boton, en vez de una
    // peticion por casilla: en el mostrador, con la conexion de Saravena,
    // media docena de peticiones sueltas puede dejar la asignacion a
    // medias sin que el dueno lo note.
    alternar(p, id) {
      const i = p.servicios.indexOf(id);
      if (i === -1) p.servicios.push(id); else p.servicios.splice(i, 1);
    },
    async guardarServicios(p) {
      this.guardando = true; this.guardado = null; this.errorAsig = {};
      try {
        const r = await api(`/profesionales/${p.id}`, {
          method: "PATCH",
          body: JSON.stringify({ servicios: p.servicios }),
        });
        if (!r) return;
        if (!r.ok) {
          this.errorAsig[p.id] = "No se pudieron guardar los servicios.";
          return;
        }
        this.guardado = p.id;
        await this.cargar();
      } catch (e) {
        this.errorAsig[p.id] = "No se pudo contactar el servidor.";
        console.error("Asignación de servicios:", e);
      } finally {
        this.guardando = false;
      }
    },
    async cargar() {
      let r = await api("/servicios");
      if (r && r.ok) { const d = await r.json(); this.servicios = d.results || d; }
      r = await api("/profesionales");
      if (r && r.ok) { const d = await r.json(); this.profesionales = d.results || d; }
    },
    async crearServicio() {
      this.errorS = "";
      const r = await api("/servicios", { method: "POST", body: JSON.stringify(this.nuevo) });
      if (!r.ok) { this.errorS = "Verifica los datos (la duración debe ser mayor a 0)."; return; }
      this.nuevo = { nombre: "", duracion_min: 30 };
      await this.cargar();
    },
    async borrarServicio(s) {
      if (!confirm(`¿Eliminar «${s.nombre}»?`)) return;
      const r = await api(`/servicios/${s.id}`, { method: "DELETE" });
      // Se cuenta lo que de verdad paso. Antes la respuesta era un 204 mudo,
      // identico tanto si el servicio se borro como si solo se desactivo, y
      // el dueno no tenia forma de saber cual de las dos cosas ocurrio.
      if (r && r.ok) {
        const d = await r.json().catch(() => null);
        if (d && d.detalle) this.avisoS = d.detalle;
      }
      await this.cargar();
    },
    async reactivarServicio(s) {
      this.avisoS = "";
      await api(`/servicios/${s.id}`, {
        method: "PATCH", body: JSON.stringify({ activo: true }),
      });
      await this.cargar();
    },
    async crearProfesional() {
      this.errorP = "";
      const r = await api("/profesionales", { method: "POST", body: JSON.stringify(this.nuevoProf) });
      if (!r.ok) { this.errorP = "Revisa el límite de tu plan o los datos."; return; }
      this.nuevoProf = { nombre: "", telefono_whatsapp: "" };
      await this.cargar();
    },
  };
}
</script>
{% endblock %}
{% block nav %}
{% include "web/_nav.html" with activo="servicios" %}
{% endblock %}
