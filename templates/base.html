{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}GlowBot{% endblock %}</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{
    --azul:#3B82C4; --azul-oscuro:#2A5F92; --azul-suave:#EAF2FA;
    --dorado:#D4AF37; --dorado-suave:#FBF6E3;
    --tinta:#1F2937; --gris:#6B7280; --linea:#E5E7EB;
    --fondo:#F7F8FA; --blanco:#FFFFFF; --rojo:#C0392B; --verde:#1A7A4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--fondo);color:var(--tinta);min-height:100vh;
       display:flex;flex-direction:column}
  header.marca{background:var(--azul);color:#fff;padding:14px 16px;
       display:flex;align-items:center;justify-content:space-between}
  header.marca .logo{font-size:20px;font-weight:700;letter-spacing:.3px}
  header.marca .logo b{color:var(--dorado)}
  main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:16px}
  .tarjeta{background:var(--blanco);border:1px solid var(--linea);
       border-radius:14px;padding:16px;margin-bottom:12px}
  .boton{display:inline-block;width:100%;padding:12px;border:0;border-radius:10px;
       background:var(--azul);color:#fff;font-size:16px;font-weight:600;
       text-align:center;cursor:pointer;text-decoration:none}
  .boton:active{background:var(--azul-oscuro)}
  .boton.secundario{background:var(--blanco);color:var(--azul);
       border:1.5px solid var(--azul)}
  .boton.peligro{background:var(--blanco);color:var(--rojo);
       border:1.5px solid var(--rojo)}
  input,select{width:100%;padding:11px;border:1px solid var(--linea);
       border-radius:10px;font-size:16px;background:var(--blanco)}
  label{display:block;font-size:14px;color:var(--gris);margin:10px 0 4px}
  .pie{padding:12px;text-align:center;font-size:12px;color:var(--gris)}
  .insignia{display:inline-block;background:var(--dorado-suave);color:#8A6D1A;
       border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
  a:focus-visible,button:focus-visible,input:focus-visible{
       outline:3px solid var(--dorado);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
{% block estilos %}{% endblock %}
</head>
<body>
<header class="marca">
  <span class="logo">Glow<b>Bot</b></span>
  {% block cabecera_extra %}{% endblock %}
</header>
<main>{% block contenido %}{% endblock %}</main>
<footer class="pie">GlowBot · Saravena, Arauca · 2026</footer>
{% block guiones %}{% endblock %}
</body>
</html>
